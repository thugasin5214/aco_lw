# 复制为 config.toml（已 gitignore）后按需修改；未写的项用代码默认值。
# comfy_url = "http://127.0.0.1:8188"
# lms_url = "http://127.0.0.1:1234"
# llm_model = "qwen3.8-27b-splash"
# llm_idle_ttl_s = 300
# memory_margin_gib = 8.0
# language = "en"                    # console default & system messages: en | zh
# web_port = 8790
# round_size = 4                      # 每轮候选数

# Telegram：@BotFather 新建 bot 得到 token；chat_id 可先启动 daemon 后给 bot 发 /whoami 查看
# telegram_token = "123456:ABC..."
# telegram_chat_ids = [123456789]     # 白名单，只响应这些 chat

# Planner / sessions
# planner_backend = "lmstudio"        # lmstudio | openai_compatible
# openai_base_url = ""                # for openai_compatible
# openai_model = ""
# openai_api_key = ""
# planner_fast = false                # append /no_think: ~35% faster, slightly weaker understanding
# llm_session_ttl_s = 1200            # keep the LLM (and its prompt cache) loaded while a session is active
# session_summary_tokens = 16000      # summarize older exchanges beyond this prompt size

# ---- When the local LLM can't run (e.g. a video render holds the memory) ----
# Online fallback is OFF unless allow_online = true (your requests and project context would be sent out).
# allow_online = false
# llm_fallback = ["anthropic", "openrouter", "claude_code", "codex"]   # tried in order
#   anthropic / openrouter / openai_compatible : online API, continues the same request step by step
#   claude_code / codex           : the local agent CLI (its own login + online model) runs the whole
#                                   request with only aco_lw's MCP tools — no shell, no file access
# anthropic_model = "claude-opus-5-5"
# anthropic_effort = "medium"           # low | medium | high | xhigh | max
# anthropic_api_key = ""                # empty: the SDK uses ANTHROPIC_API_KEY or `ant auth login`
# anthropic_fallbacks = true            # server-side retry on a safety-classifier refusal
# openrouter_model = ""                # an OpenRouter model ID (required for openrouter)
# openrouter_api_key = ""              # empty: OPENROUTER_API_KEY
# claude_cmd = "claude"
# claude_model = ""                     # empty: Claude Code's own default
# codex_cmd = "codex"
# codex_model = ""
# agent_cli_timeout_s = 3600
# planner_backend = "lmstudio"          # set to "anthropic" to make the online model primary
