title: 图生图 · FLUX.2 Klein 双参考（人物 + 场景）
kind: image
model: flux2-klein-4b-q8
source: 标准实验室/02-图生图-参考编辑-API.json + 第二条 ReferenceLatent（核心节点）
release_after: keep
output_prefix: {node: "16", field: filename_prefix}
# two reference images feed the conditioning in order (image 1 → image 2); refer to them as "image 1 / image 2" in the prompt
slots:
  prompt:     {node: "7", field: text, type: str}
  image:      {node: "4", field: image, type: image, required: true}
  image2:     {node: "22", field: image, type: image, required: true}
  megapixels: {node: "5", field: megapixels, type: float, min: 0.25, max: 2.0}
  seed:       {node: "10", field: noise_seed, type: int, min: 0}
  steps:      {node: "12", field: steps, type: int, min: 1, max: 8}
  width:      {node: "20", field: value, type: int, min: 256, max: 2048, multiple_of: 16}
  height:     {node: "21", field: value, type: int, min: 256, max: 2048, multiple_of: 16}
tiers:
  standard: {width: 1280, height: 720, verified: false}   # unmeasured; single reference at this tier measured 26.8 s
  portrait: {width: 896, height: 1152, verified: false}
default_tier: standard
