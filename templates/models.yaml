# 模型注册表：峰值为 G0 实测（docs/baseline.md）；新模型先实测再登记。
flux2-klein-4b-q8:
  kind: image
  peak_gib: 16      # 冷启动 ComfyUI RSS 15.7 GiB
  measured: true
freevideo-h3:
  kind: video
  peak_gib: 54      # FreeVideo ram_peak_bytes（phys_footprint）53.4–54.2 GiB
  measured: true
  exclusive_llm: true   # 提交前卸载 LLM（G0：共存进入内存压力警告 + swap）
  adaptive: true        # 按可用内存自适应：hd-60s 实测占到 98.4 GiB 只是“有就用”，准入仍按 peak_gib
ffmpeg:
  kind: video
  peak_gib: 1       # 估算：x264 编码 720p
  resource: cpu     # 不经内存闸门、不卸载 LLM、不释放 ComfyUI；可与渲染并存
  exec_s: 20        # 估算，跑过后用实测历史
comfy-raw:
  kind: video
  peak_gib: 54      # 未知 workflow：按最重的视频模型保守估计（估算）
  exclusive_llm: true
  adaptive: true
minimax-h3-native:
  kind: video
  peak_gib: 54      # 估算：与 FreeVideo 同一套 int8 主干 + nvfp4 编码（FreeVideo 实测 54 GiB）；首次实测后改
  exclusive_llm: true
  adaptive: true
ltx-2.5-distilled:
  kind: video
  peak_gib: 50      # 估算：21.5 GB int8 主干 + 15.4 GB Gemma 编码 + VAE / 放大器 + 激活；首次实测后改
  exclusive_llm: true
  adaptive: true
