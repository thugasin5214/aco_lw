# Model registry: peaks are G0 measurements; measure a new model before registering it.
flux2-klein-4b-q8:
  kind: image
  peak_gib: 16      # cold-start ComfyUI RSS 15.7 GiB
  measured: true
  lora_base: [flux2-klein-4b]   # Klein 4B LoRAs (flux2-lora-t2i / flux2-lora-edit)
freevideo-h3:
  kind: video
  peak_gib: 54      # FreeVideo ram_peak_bytes（phys_footprint）53.4–54.2 GiB
  measured: true
  exclusive_llm: true   # unload the LLM before submitting (G0: coexisting led to memory-pressure warnings + swap)
  lora_base: [minimax-h3]
  adaptive: true        # adapts to available memory: hd-60s measured at 98.4 GiB only because it was there; admission still uses peak_gib
ffmpeg:
  kind: video
  peak_gib: 1       # estimate: x264 encoding at 720p
  resource: cpu     # skips the memory gate, does not unload the LLM or release ComfyUI; can run alongside renders
  exec_s: 20        # estimate; measured history is used once it has run
comfy-raw:
  kind: video
  peak_gib: 54      # unknown workflow: conservatively the heaviest video model (estimate)
  exclusive_llm: true
  adaptive: true
minimax-h3-native:
  kind: video
  peak_gib: 54      # estimate: same int8 backbone + nvfp4 encoder as FreeVideo (FreeVideo measured 54 GiB); update after the first measurement
  exclusive_llm: true
  adaptive: true
ltx-2.5-distilled:
  kind: video
  peak_gib: 50      # estimate: 21.5 GB int8 backbone + 15.4 GB Gemma encoder + VAE / upscaler + activations; update after the first measurement
  exclusive_llm: true
  adaptive: true
z-image-bf16:
  kind: image
  peak_gib: 28      # estimate: DiT bf16 12.3 GB + Qwen3-4B 8 GB + VAE + activations; update after measuring
  measured: false
