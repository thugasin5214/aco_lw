title: 图生图 · Z-Image 参考重绘（保构图，调肤质 / 光线）
kind: image
model: z-image-bf16
source: 标准实验室/07-ZImage-精致肤质-参考重绘.json（UI → API）
release_after: keep
output_prefix: {node: "16", field: filename_prefix}
# 普通 img2img：denoise 越低越像原图（0.35–0.6）。不是换姿势保身份的参考编辑——那个用 flux2-edit。
slots:
  prompt:   {node: "5", field: text, type: str}
  negative: {node: "6", field: text, type: str}
  image:    {node: "10", field: image, type: image, required: true}
  denoise:  {node: "8", field: denoise, type: float, min: 0.1, max: 1.0}
  seed:     {node: "8", field: seed, type: int, min: 0}
  steps:    {node: "8", field: steps, type: int, min: 8, max: 50}
  cfg:      {node: "8", field: cfg, type: float, min: 1.0, max: 8.0}
tiers:
  standard: {verified: false}
default_tier: standard
