title: 参考生视频 · FreeVideo agent API（参考视频复刻运镜 / 动作 + 参考图定人物）
kind: video
model: freevideo-h3
executor: freevideo
release_after: keep
# not a ComfyUI workflow: api.json only carries parameters; executors/freevideo.py builds the generate job for POST /jobs.
# referenced in order in the prompt: <Video 1> = ref_video; <Picture 1>, <Picture 2> = ref_image, ref_image2.
# early_steps: the reference video guides only the first K steps of the first pass (FreeVideo guide: 3 of 8), then it is dropped — keeps camera moves, blocking and action rhythm,
# while texture, characters and light come from the prompt and reference images; omitted, the reference video guides every step (closer to the source, characters drift toward it more easily).
# note: FreeVideo on Mac does not implement early_steps (CUDA only); the executor refuses it outright.
slots:
  prompt:      {node: "1", field: prompt, type: str, required: true}
  ref_video:   {node: "1", field: ref_video, type: image}          # local video path (24 fps, ≤ 15 s)
  early_steps: {node: "1", field: early_steps, type: int, min: 0, max: 32}
  ref_image:   {node: "1", field: ref_image, type: image}
  ref_image2:  {node: "1", field: ref_image2, type: image}
  seed:        {node: "1", field: seed, type: int, min: 0}
  quality:     {node: "1", field: quality, type: str}               # light / medium / high / max
  width:       {node: "1", field: width, type: int, min: 256, max: 4096, multiple_of: 32}
  height:      {node: "1", field: height, type: int, min: 256, max: 4096, multiple_of: 32}
  seconds:     {node: "1", field: seconds, type: float, min: 1.625, max: 15}
tiers:
  draft-5s:   {width: 960, height: 544, seconds: 5, quality: light, verified: false}   # camera-move draft tier from the FreeVideo guide
  light-10s:  {width: 1344, height: 768, seconds: 10, quality: light, verified: false}
  medium-10s: {width: 1344, height: 768, seconds: 10, quality: medium, verified: false}
default_tier: draft-5s
