title: FreeVideo 电影镜头 take（由 FreeVideo agent API 拍摄）
kind: video
model: freevideo-h3
executor: freevideo
release_after: keep
# not run by the Worker: takes are shot in a FreeVideo film and imported as tasks for review; redo / reject become a FreeVideo reshoot
slots:
  prompt: {node: "1", field: prompt, type: str}
  film:   {node: "1", field: film, type: str, required: true}
  shot:   {node: "1", field: shot, type: str, required: true}
  take:   {node: "1", field: take, type: int, min: 1}
tiers:
  take: {verified: true}
default_tier: take
