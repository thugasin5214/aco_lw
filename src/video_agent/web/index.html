<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aco_lw Console</title>
<style>
:root{
  --bg:#f5f7fa;--card:#fff;--line:#d5dde8;--text:#14202e;--muted:#5a6879;--accent:#1f5f99;
  --acc-tint:rgba(31,95,153,.10);--ok:#2f7d4f;--ok-tint:rgba(47,125,79,.12);--warn:#9a5b00;
  --warn-tint:rgba(154,91,0,.12);--bad:#b3261e;--bad-tint:rgba(179,38,30,.10);--idle:#8a97a8;
  --bubble-in:#e6effa;--shade:rgba(10,16,24,.45);color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c;--card:#18212e;--line:#2f3c50;--text:#e6edf6;--muted:#9fb0c5;--accent:#8ecbff;
  --acc-tint:rgba(142,203,255,.12);--ok:#7fd3a0;--ok-tint:rgba(127,211,160,.12);--warn:#f0c27a;
  --warn-tint:rgba(240,194,122,.12);--bad:#ff9a92;--bad-tint:rgba(255,154,146,.12);--idle:#6f819b;
  --bubble-in:#1f3550;--shade:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c;--card:#18212e;--line:#2f3c50;--text:#e6edf6;--muted:#9fb0c5;--accent:#8ecbff;
  --acc-tint:rgba(142,203,255,.12);--ok:#7fd3a0;--ok-tint:rgba(127,211,160,.12);--warn:#f0c27a;
  --warn-tint:rgba(240,194,122,.12);--bad:#ff9a92;--bad-tint:rgba(255,154,146,.12);--idle:#6f819b;
  --bubble-in:#1f3550;--shade:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.6 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif}
button,select,textarea,input{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 20px;
  border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
h1{font-size:17px;margin:0;font-weight:650}
.stat{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.stat b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tab,.btn{border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 12px;
  border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
.tab.on{background:var(--acc-tint);color:var(--accent);border-color:var(--accent)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.primary:hover{opacity:.9;color:var(--card)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.lang{margin-left:6px}
.count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;
  background:var(--warn);color:var(--card);font-size:11px;font-weight:700;text-align:center}
main{padding:18px 20px 60px;max-width:1500px;margin:auto}
.view{display:none}.view.on{display:block}
.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
.layout.proj{grid-template-columns:minmax(240px,.5fr) minmax(0,1.5fr)}
@media (max-width:980px){.layout,.layout.proj{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:600;display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .sp{flex:1}
h3.sub{font-size:13px;color:var(--muted);margin:16px 0 8px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{color:var(--muted);font-size:14px;padding:26px 4px;text-align:center}
.hint{font-size:12.5px;color:var(--muted)}
.banner{border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:14px;display:none}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;
  background:var(--acc-tint);color:var(--accent);white-space:nowrap}
.badge.ok{background:var(--ok-tint);color:var(--ok)}.badge.warn{background:var(--warn-tint);color:var(--warn)}
.badge.bad{background:var(--bad-tint);color:var(--bad)}.badge.idle{background:var(--bg);color:var(--muted)}
.badge.live{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.badge.live,.stage.active .ring{animation:none}}
select.sm,input.sm{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 8px;font-size:13px}
/* DAG */
#dag{position:relative;overflow:auto;min-height:220px;max-height:70vh}
#dag svg{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;cursor:pointer}
.node:hover{border-color:var(--accent)}
.node.sel{outline:2px solid var(--accent);outline-offset:1px}
.node .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .s{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:2px}
.thumbs{display:flex;gap:4px;margin-top:6px}
.thumbs .th{width:40px;height:40px;border-radius:5px;object-fit:cover;background:var(--bg);
  border:1px solid var(--line);flex:none}
.thumbs .th.pick{outline:2px solid var(--ok);outline-offset:1px}
.thumbs .th.dim{opacity:.4}
/* pipeline */
.pipe{display:flex;align-items:flex-start;overflow-x:auto;padding:4px 2px 10px}
.stage{display:flex;flex-direction:column;align-items:center;min-width:78px;flex:1;position:relative}
.stage .ring{width:28px;height:28px;border-radius:50%;border:2px solid var(--idle);display:grid;
  place-items:center;font-size:12.5px;font-weight:700;background:var(--card);color:var(--muted);z-index:1}
.stage.done .ring{border-color:var(--ok);background:var(--ok-tint);color:var(--ok)}
.stage.active .ring{border-color:var(--accent);background:var(--acc-tint);color:var(--accent);
  animation:pulse 1.4s ease-in-out infinite}
.stage.failed .ring{border-color:var(--bad);background:var(--bad-tint);color:var(--bad)}
.stage .lbl{font-size:12px;margin-top:6px;font-weight:600;text-align:center}
.stage .dur{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage:not(:last-child)::after{content:"";position:absolute;top:14px;left:calc(50% + 16px);
  right:calc(-50% + 16px);height:2px;background:var(--line)}
.stage.done:not(:last-child)::after{background:var(--ok)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:12px 0;font-size:13.5px}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.media img,.media video{width:100%;border-radius:8px;border:1px solid var(--line);background:#000;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.cand{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card)}
.cand.hl{outline:2px solid var(--accent);outline-offset:1px}
.cand.picked{border-color:var(--ok)}
.cand .row{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:6px;flex-wrap:wrap}
.cand .idx{font-weight:700;font-size:13px}
.note{display:none;margin-top:6px}
.note.on{display:flex;gap:6px}
textarea.in,.note textarea{flex:1;min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
  padding:6px 8px;resize:vertical;font-size:13.5px;width:100%}
.events{font-size:12.5px;color:var(--muted);margin:10px 0 0;padding-left:16px}
details{margin-top:10px}summary{cursor:pointer;color:var(--muted);font-size:13px}
pre{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;
  overflow:auto;max-height:300px;white-space:pre-wrap;overflow-wrap:anywhere}
.err{color:var(--bad);font-size:13px;margin-top:8px;overflow-wrap:anywhere}
.review-item{margin-bottom:18px}
.review-item.active{border-color:var(--accent)}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* projects */
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;
  padding:8px;cursor:pointer;background:var(--card)}
.pitem:hover{border-color:var(--accent)}.pitem.sel{outline:2px solid var(--accent);outline-offset:1px}
.pitem img,.pitem .ph{width:48px;height:48px;border-radius:7px;object-fit:cover;background:var(--bg);
  border:1px solid var(--line);flex:none}
.pitem .m{min-width:0;flex:1}.pitem .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .x{font-size:12px;color:var(--muted)}
.ptabs{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 4px}
.packs{display:flex;flex-direction:column;gap:8px}
.packv{display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap}
.packv .v{font-weight:700;color:var(--accent);width:34px}
.packv figure{margin:0;text-align:center;font-size:11.5px;color:var(--muted)}
.packv img,.packv video{width:64px;height:64px;object-fit:cover;border-radius:7px;border:1px solid var(--line);display:block}
.timeline{font-size:13px;display:flex;flex-direction:column;gap:6px}
.timeline .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sessions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sess{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12.5px;cursor:pointer;background:var(--card);color:var(--muted)}
.sess.on{border-color:var(--accent);color:var(--accent);background:var(--acc-tint)}
.sess .c{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;
  border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px}
.msg{max-width:82%;padding:7px 11px;border-radius:12px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.in{align-self:flex-end;background:var(--bubble-in)}
.msg.out{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12.5px;padding:2px 6px}
.msg .meta{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.msg .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.msg img.att{max-width:140px;border-radius:6px;display:block;margin-top:6px;border:1px solid var(--line)}
.chatbox{display:flex;gap:8px;margin-top:10px;align-items:center}
.chatbox input[type=text]{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px 12px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:12px;background:var(--card)}
.chip img{width:28px;height:28px;object-fit:cover;border-radius:4px}
.mem{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.mem:last-child{border-bottom:0}.mem .tx{flex:1;overflow-wrap:anywhere}.mem .pin{color:var(--warn)}
.mem.arch .tx{color:var(--muted);text-decoration:line-through}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.gallery .item{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gallery img,.gallery video{width:100%;display:block;background:#000;aspect-ratio:16/10;object-fit:contain}
.gallery .cap{padding:8px 10px;font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.gallery .cap span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
iframe{width:100%;height:calc(100vh - 120px);border:1px solid var(--line);border-radius:12px;background:var(--card)}
kbd{font:11.5px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--bg)}
/* modal */
.modal{position:fixed;inset:0;background:var(--shade);display:none;align-items:flex-start;justify-content:center;z-index:20;padding:40px 16px;overflow:auto}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(760px,100%)}
.modal .box h2{margin:0 0 12px;font-size:16px;display:flex;gap:8px;align-items:center}
.form{display:grid;grid-template-columns:max-content 1fr;gap:8px 12px;align-items:center;font-size:13.5px}
.form label{color:var(--muted)}
.form input[type=number],.form input[type=text]{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:5px 8px;width:100%}
.ctxmsg{border:1px solid var(--line);border-radius:8px;margin:8px 0}
.ctxmsg .r{font-size:12px;color:var(--muted);padding:4px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.ctxmsg pre{border:0;margin:0;max-height:260px}
@media (max-width:600px){header{padding:10px 16px}main{padding:14px 16px 40px}nav{margin-left:0}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1 data-t="title">aco_lw Console</h1>
  <span class="stat"><span class="dot" id="d-daemon"></span><b id="s-daemon">–</b></span>
  <span class="stat"><span class="dot" id="d-mem"></span><span data-t="memory">Memory</span> <b id="s-mem">–</b></span>
  <span class="stat"><span class="dot" id="d-comfy"></span>ComfyUI <b id="s-comfy">–</b></span>
  <span class="stat"><span class="dot" id="d-llm"></span>LLM <b id="s-llm">–</b></span>
  <span class="stat"><span data-t="project">Project</span> <b id="s-proj">–</b></span>
  <nav>
    <button class="tab on" data-view="flow" data-t="tab.flow">Flow</button>
    <button class="tab" data-view="review"><span data-t="tab.review">Review</span><span class="count" id="c-review" hidden></span></button>
    <button class="tab" data-view="projects" data-t="tab.projects">Projects &amp; Chat</button>
    <button class="tab" data-view="gallery" data-t="tab.gallery">Outputs</button>
    <button class="tab" data-view="progress" data-t="tab.progress">Progress</button>
    <button class="tab" data-view="runbook" data-t="tab.runbook">Runbook</button>
    <select class="sm lang" id="lang" aria-label="Language"><option value="en">EN</option><option value="zh">中文</option></select>
  </nav>
</header>
<main>
  <div class="banner" id="banner"></div>

  <section class="view on" id="v-flow">
    <div class="layout">
      <div class="card">
        <h2><span data-t="flow.title">Creative flow (DAG)</span> <span class="sp"></span>
          <select class="sm" id="flow-project" aria-label="Project filter"></select></h2>
        <div id="dag"></div>
        <div class="hint" style="margin-top:8px" data-t="flow.hint">One node = one round of candidates (or a standalone task). Arrows = derived from a previous decision (tweak / redo / reject) or reuse of its output. Green outline = selected candidate.</div>
      </div>
      <div class="card"><h2 data-t="detail">Details</h2><div id="detail"></div></div>
    </div>
  </section>

  <section class="view" id="v-review">
    <div class="hint" style="margin-bottom:12px" data-t="review.keys" data-html="1"></div>
    <div id="review"></div>
  </section>

  <section class="view" id="v-projects">
    <div class="layout proj">
      <div class="card">
        <h2><span data-t="projects">Projects</span> <span class="sp"></span>
          <select class="sm" id="proj-filter" aria-label="Filter"></select>
          <button class="btn" id="proj-new" data-t="new">New</button></h2>
        <div class="plist" id="plist"></div>
      </div>
      <div class="card" id="pdetail"></div>
    </div>
  </section>

  <section class="view" id="v-gallery">
    <div class="toolbar">
      <button class="tab on" data-kind="all" data-t="all">All</button>
      <button class="tab" data-kind="image" data-t="images">Images</button>
      <button class="tab" data-kind="video" data-t="videos">Videos</button>
    </div>
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="view" id="v-progress"><iframe title="Progress" data-src="/progress"></iframe></section>
  <section class="view" id="v-runbook"><iframe title="Runbook" data-src="/runbook"></iframe></section>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modal-box"></div></div>

<script>

const I18N = {

    gate: "Memory gate", genmem: "Memory during run", params: "Parameters", events: "Events", "err": "Error",
    "gate.v": "needs {r} GiB · waited {w}{a}", "mem.v": "min free {m} GiB · pressure {p} · swap {s} GiB",
    "fv.v": "sampling {s} · peak {p} GiB", "pipe.of": "Pipeline of candidate #{n}", round: "Round", decision: "Decision",

/* ================= DAG ================= */
function renderDag(){
  const box = $("#dag");
  if (!GRAPH.length){ box.innerHTML = `<div class="empty">${t("flow.empty")}</div>`; return; }
  const byId = Object.fromEntries(GRAPH.map(n => [n.id, n]));
  const kids = {}; GRAPH.forEach(n => n.parents.filter(p => byId[p]).forEach(p => (kids[p] ||= []).push(n)));
  const roots = GRAPH.filter(n => !n.parents.some(p => byId[p])).sort((a,b) => b.created - a.created);
  const W = 232, H = 104, GX = 48, GY = 14, pos = {}, seen = new Set();
  let y = 0;
  const place = (n, depth) => {
    if (seen.has(n.id)) return pos[n.id].y; seen.add(n.id);
    const ch = (kids[n.id] || []).sort((a,b) => a.created - b.created).filter(c => !seen.has(c.id));
    if (!ch.length){ pos[n.id] = {x: depth*(W+GX), y}; y += H + GY; return pos[n.id].y; }
    const ys = ch.map(c => place(c, depth+1));
    pos[n.id] = {x: depth*(W+GX), y: (ys[0] + ys[ys.length-1]) / 2};
    return pos[n.id].y;
  };
  roots.forEach(r => place(r, 0));
  GRAPH.forEach(n => { if (!pos[n.id]) place(n, 0); });
  const maxX = Math.max(...Object.values(pos).map(p => p.x)) + W + 4, maxY = y + 4;
  let edges = "";
  GRAPH.forEach(n => n.parents.forEach(pid => {
    const p = pos[pid], c = pos[n.id]; if (!p || !c) return;
    const x1 = p.x + W, y1 = p.y + 52, x2 = c.x, y2 = c.y + 52, mx = (x1+x2)/2;
    edges += `<path d="M${x1} ${y1} C${mx} ${y1},${mx} ${y2},${x2} ${y2}" fill="none" stroke="var(--idle)" stroke-width="1.6" marker-end="url(#arr)"/>`;
  }));
  const nodes = GRAPH.map(n => {
    const p = pos[n.id], pick = n.decision?.task_id;
    const thumbs = n.tasks.slice(0, 5).map(tk => {
      const o = (tk.outputs || [])[0];
      const cls = "th" + (pick === tk.id ? " pick" : "") + (["rejected","failed"].includes(tk.state) && pick ? " dim" : "");
      return o ? media(tk, o, cls, false) : `<div class="${cls}"></div>`;
    }).join("");
    return `<div class="node ${n.id === selNode ? "sel" : ""}" data-id="${esc(n.id)}" style="left:${p.x}px;top:${p.y}px;width:${W}px;height:${H}px">
      <div class="t" title="${esc(n.title)}">${esc(n.title)}</div>
      <div class="s">${badge(n.state)} <span>${esc(n.tier || "")}${n.type === "round" ? " × " + n.tasks.length : ""}</span> <span>${esc(decName(n.decision))}</span></div>
      <div class="thumbs">${thumbs}</div></div>`;
  }).join("");
  box.innerHTML = `<svg width="${maxX}" height="${maxY}"><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--idle)"/></marker></defs>${edges}</svg>
    <div style="position:relative;width:${maxX}px;height:${maxY}px">${nodes}</div>`;
  box.querySelectorAll(".node").forEach(el => el.onclick = () => { selNode = el.dataset.id; selTask = null; detailKey = ""; renderDag(); renderDetail(); });
}

function stagesOf(tk){
  const at = {}; tk.events.forEach(e => { if (!(e.state in at)) at[e.state] = e.ts; });
  if (at.done || at.rejected) at.final = at.done || at.rejected;
  const bad = ["failed","timeout"].includes(tk.state);
  const last = STAGES.map(k => k in at).lastIndexOf(true);
  return STAGES.map((k, i) => {
    let cls = "", dur = null;
    const later = STAGES.slice(i+1).find(k2 => k2 in at);
    if (k in at || i < last) cls = "done";
    if (k in at && later) dur = at[later] - at[k];
    if (i === last && !bad && !["done","rejected"].includes(tk.state) && k !== "final"){ cls = "active"; dur = k === "review" ? null : Date.now()/1000 - at[k]; }
    if (bad && i === last + 1) cls = "failed";
    if (k === "final" && tk.state === "rejected") cls = "failed";
    return {name: t("stage." + k), cls, dur};
  });
}

    <details><summary>${t("params")}</summary><pre>${esc(JSON.stringify(params, null, 2))}</pre></details>
    <details><summary>${t("events")}</summary><ol class="events">${tk.events.map(e => `<li>${fmtT(e.ts)} · ${esc(stateName(e.state))}${e.note ? " · " + esc(e.note) : ""}</li>`).join("")}</ol></details>`;

/* ================= manual tweak (W1) ================= */
async function openTweak(taskId){
  let tk, tpl;
  try { tk = await api(`/api/tasks/${encodeURIComponent(taskId)}`); tpl = await api(`/api/templates/${encodeURIComponent(tk.template)}`); }
  catch(e){ return toast(t("not.done") + e.message, true); }
  const field = (name, s) => {
    const v = tk.params[name];
    if (s.type === "str") return `<textarea class="in" name="${name}" rows="${name === "prompt" ? 7 : 2}">${esc(v ?? "")}</textarea>`;
    if (s.type === "bool") return `<input type="checkbox" name="${name}" ${v ? "checked" : ""}>`;
    if (s.type === "image") return `<input type="text" name="${name}" value="${esc(v ?? "")}" placeholder="@pack:… / @task:… / @upload:… / path">`;
    const step = s.type === "int" ? (s.multiple_of || 1) : "any";
    return `<input type="number" name="${name}" value="${esc(v ?? "")}" ${s.min != null ? `min="${s.min}"` : ""} ${s.max != null ? `max="${s.max}"` : ""} step="${step}">`;
  };
  const tiers = Object.entries(tpl.tiers).map(([k, v]) => `<option value="${k}" ${k === tk.tier ? "selected" : ""}>${k} ${Object.entries(v).filter(([a]) => a !== "verified").map(([a, b]) => `${a}=${b}`).join(" ")} ${v.verified ? "" : t("unverified")}</option>`).join("");
  modal(`<h2>${t("tweak.title")}</h2><div class="hint" style="margin-bottom:10px">${esc(tk.template)} · ${esc(tk.id)}</div>
    <form class="form" id="tweak-form">
      ${Object.entries(tpl.slots).map(([n, s]) => `<label>${esc(n)}</label><div>${field(n, s)}</div>`).join("")}
      <label>${t("tier")}</label><div><select class="sm" name="__tier">${tiers}</select></div>
      <label>${t("count")}</label><div><input type="number" name="__n" value="1" min="1" max="8"></div>
    </form>
    <div class="actions" style="margin-top:14px;justify-content:flex-end">
      <button class="btn" onclick="closeModal()">${t("cancel")}</button>
      <button class="btn primary" id="tweak-go">${t("submit")}</button></div>`);
  $("#tweak-go").onclick = async () => {
    const f = $("#tweak-form"), params = {};
    Object.entries(tpl.slots).forEach(([n, s]) => {
      const el = f.elements[n]; if (!el) return;
      let v = s.type === "bool" ? el.checked : el.value;
      if (s.type === "int") v = v === "" ? undefined : parseInt(v, 10);
      if (s.type === "float") v = v === "" ? undefined : parseFloat(v);
      if (v !== undefined && JSON.stringify(v) !== JSON.stringify(tk.params[n])) params[n] = v;
    });
    const r = await act(`/api/tasks/${encodeURIComponent(taskId)}/tweak`, {params, tier: f.elements.__tier.value, n: parseInt(f.elements.__n.value, 10) || 1});
    if (r) { closeModal(); selNode = r.id; selTask = null; keys.g = ""; }
  };
}

/* ================= review ================= */
function renderReview(){
  const box = $("#review");
  if (!REVIEW.length){ box.innerHTML = `<div class="empty">${t("review.empty")}</div>`; return; }
  reviewActive = Math.min(reviewActive, REVIEW.length - 1);
  const proj = Object.fromEntries(PROJECTS.map(p => [p.id, p.name]));
  box.innerHTML = REVIEW.map((it, i) => {
    const isRound = it.type === "round";
    const cands = it.tasks.map(tk => `<div class="cand ${i === reviewActive && (tk.idx || 1) === hlIdx ? "hl" : ""}" data-idx="${tk.idx || 1}">
      <div class="media">${media(tk, (tk.outputs || [])[0])}</div>
      <div class="row"><span class="idx">#${tk.idx || 1}</span>${badge(tk.state)}</div>
      ${tk.state === "review" ? `<div class="row">${roleSelect()}
        <button class="btn primary" onclick="pass(${i}, ${tk.idx || 1}, this)">${t("approve")}</button></div>
      <div class="row">${isRound ? `<button class="btn" onclick="openNote(${i}, 'f', ${tk.idx})">${t("refine")}</button>` : ""}
        <button class="btn" onclick="openTweak('${esc(tk.id)}')">${t("tweak")}</button></div>
      ${isRound ? `<div class="note" id="note-f-${i}-${tk.idx}"><textarea placeholder="${esc(t("note.refine", {n: tk.idx}))}"></textarea><button class="btn primary" onclick="sendNote(${i}, 'f', ${tk.idx})">${t("send")}</button></div>` : ""}` : ""}
      ${tk.error ? `<div class="err">${esc(tk.error)}</div>` : ""}</div>`).join("");
    return `<div class="card review-item ${i === reviewActive ? "active" : ""}" data-i="${i}">
      <h2>${esc(it.title || it.template)} <span class="badge idle">${esc(it.template)} / ${esc(it.tier || "")}</span>
        <span class="hint">${esc(proj[it.project_id] || "")} · ${fmtT(it.created)}</span><span class="sp"></span>
        ${isRound ? `<button class="btn" onclick="act('/api/rounds/${it.id}/redo', {})">${t("redo.round")}</button>
          <button class="btn danger" onclick="openNote(${i}, 'x')">${t("reject.note")}</button>`
        : `<button class="btn" onclick="act('/api/tasks/${it.id}/redo', {})">${t("redo")}</button>
          <button class="btn danger" onclick="act('/api/tasks/${it.id}/approve', {accept:false})">${t("reject")}</button>`}</h2>
      ${isRound ? `<div class="note" id="note-x-${i}"><textarea placeholder="${esc(t("note.reject"))}"></textarea><button class="btn primary" onclick="sendNote(${i}, 'x')">${t("send")}</button></div>` : ""}
      <div class="grid">${cands}</div></div>`;
  }).join("");
  box.querySelectorAll(".review-item").forEach(el => el.addEventListener("click", () => {
    const i = +el.dataset.i; if (i !== reviewActive){ reviewActive = i; hlIdx = 1; markReview(); }
  }));
}
function markReview(){
  document.querySelectorAll(".review-item").forEach((el, i) => {
    el.classList.toggle("active", i === reviewActive);
    el.querySelectorAll(".cand").forEach(c => c.classList.toggle("hl", i === reviewActive && +c.dataset.idx === hlIdx));
  });
}
function pass(i, idx, btn){
  const it = REVIEW[i], role = btn.closest(".cand").querySelector(".role")?.value || null;
  if (it.type === "round") act(`/api/rounds/${it.id}/select`, {idx, role});
  else act(`/api/tasks/${it.id}/approve`, {accept:true, role});
}
function openNote(i, kind, idx){
  const el = document.getElementById(kind === "f" ? `note-f-${i}-${idx}` : `note-x-${i}`);
  if (el){ el.classList.add("on"); el.querySelector("textarea").focus(); }
}
function sendNote(i, kind, idx){
  const it = REVIEW[i], el = document.getElementById(kind === "f" ? `note-f-${i}-${idx}` : `note-x-${i}`);
  const note = el.querySelector("textarea").value.trim();
  if (kind === "f"){ if (!note) return toast(t("need.note"), true); act(`/api/rounds/${it.id}/refine`, {idx, note}); }
  else act(`/api/rounds/${it.id}/reject`, {note});
}
document.addEventListener("keydown", e => {
  if (view !== "review" || $("#modal").classList.contains("on") || ["TEXTAREA","INPUT","SELECT"].includes(e.target.tagName) || !REVIEW.length) return;
  const it = REVIEW[reviewActive], n = it.tasks.length;
  if (/^[1-9]$/.test(e.key) && +e.key <= n){ hlIdx = +e.key; markReview(); }
  else if (e.key === "j" || e.key === "J"){ reviewActive = Math.min(reviewActive + 1, REVIEW.length - 1); hlIdx = 1; markReview(); document.querySelector(".review-item.active")?.scrollIntoView({block:"nearest"}); }
  else if (e.key === "k" || e.key === "K"){ reviewActive = Math.max(reviewActive - 1, 0); hlIdx = 1; markReview(); document.querySelector(".review-item.active")?.scrollIntoView({block:"nearest"}); }
  else if (e.key === "Enter"){ const b = document.querySelector(`.review-item.active .cand[data-idx="${hlIdx}"] .btn.primary`); if (b) b.click(); }
  else if ((e.key === "f" || e.key === "F") && it.type === "round"){ e.preventDefault(); openNote(reviewActive, "f", hlIdx); }
  else if (e.key === "x" || e.key === "X"){ e.preventDefault(); if (it.type === "round") openNote(reviewActive, "x"); }
  else if (e.key === "r" || e.key === "R"){ act(it.type === "round" ? `/api/rounds/${it.id}/redo` : `/api/tasks/${it.id}/redo`, {}); }
});

/* ================= projects, sessions, memory, chat ================= */

      <div class="x">${t("updated", {t: fmtT(p.updated)})}</div></div></div>`).join("") : `<div class="empty">—</div>`;

let PDATA = null, MSGS = [], msgKey = "";
async function loadProject(force){
  if (!selProject){ $("#pdetail").innerHTML = `<div class="empty">${t("p.empty")}</div>`; return; }
  let p; try { p = await api(`/api/projects/${encodeURIComponent(selProject)}`); } catch { return; }
  if (!selSession || !p.sessions.some(s => s.id === selSession)) selSession = p.current_session || p.sessions[0]?.id || null;
  let msgs = []; if (selSession) { try { msgs = await api(`/api/sessions/${encodeURIComponent(selSession)}/messages`); } catch {} }
  const k = LANG + ptab + selSession + p.updated + JSON.stringify(p.memories.map(m => m.updated)) + (msgs.at(-1)?.id || 0) + p.sessions.length;
  if (!force && k === msgKey) return;
  msgKey = k; PDATA = p; MSGS = msgs;
  const isCurrentProject = SYS && SYS.project.id === p.id;
  const canChat = isCurrentProject && selSession === p.current_session && p.state === "active";
  const chat = $("#pdetail .chat"), atBottom = !chat || chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
  const tabs = ["chat","memory","rounds","pack"].map(x => `<button class="tab ${ptab === x ? "on" : ""}" onclick="ptab='${x}';loadProject(true)">${t("pt." + x)}${x === "memory" && p.memories.some(m => m.status === "proposed") ? ` <span class="count">${p.memories.filter(m => m.status === "proposed").length}</span>` : ""}</button>`).join("");
  let body = "";
  if (ptab === "chat") body = chatHtml(p, msgs, canChat);
  if (ptab === "memory") body = memoryHtml(p);
  if (ptab === "rounds") body = roundsHtml(p);
  if (ptab === "pack") body = packHtml(p);
  $("#pdetail").innerHTML = `<h2>${esc(p.name)} ${badge(p.state)}<span class="sp"></span>
      ${isCurrentProject ? `<span class="badge ok">${t("current")}</span>` : `<button class="btn" onclick="act('/api/projects/${esc(p.id)}/use', {})">${t("set.current")}</button>`}
      ${p.state === "active" ? `<button class="btn" onclick="if(confirm(t('confirm.done'))) act('/api/projects/${esc(p.id)}/done', {})">${t("mark.done")}</button>` : ""}</h2>
    <div class="hint">${t("p.created", {a: fmtT(p.created), b: fmtT(p.updated)})}${p.note ? " · " + esc(p.note) : ""}</div>
    <div class="ptabs">${tabs}</div>${body}`;
  const nc = $("#pdetail .chat"); if (nc && (atBottom || force)) nc.scrollTop = nc.scrollHeight;
  if (ptab === "chat") bindChat();
}
function chatHtml(p, msgs, canChat){
  const sess = p.sessions.map(s => `<span class="sess ${s.id === selSession ? "on" : ""}" onclick="selSession='${esc(s.id)}';loadProject(true)">${esc(s.title || s.id)}${s.id === p.current_session ? " ●" : ""}<span class="c">${s.n_messages}</span></span>`).join("");
  let lastLlm = "";
  const bubbles = msgs.map(m => {
    const cls = m.channel === "system" ? "sys" : m.direction === "in" ? "in" : "out";
    let text = m.text;  // 渠道回复会重复 LLM 原话（Telegram 需要）；控制台只显示新增部分
    if (m.channel === "llm") lastLlm = m.text;
    else if (m.direction === "out" && lastLlm && text.startsWith(lastLlm)) { text = text.slice(lastLlm.length).trim(); lastLlm = ""; if (!text) return ""; }
    const st = m.meta || {};
    const extra = m.channel === "llm" && st.seconds != null ? " · " + t("llm.stats", {s: st.seconds, t: st.prompt_tokens ?? "?", c: st.prompt_tokens ? Math.round(100 * (st.cached_tokens_est || 0) / st.prompt_tokens) : 0}) + (st.load_s ? t("load", {l: st.load_s}) : "") : "";
    const att = (st.attachments || []).map(a => `<img class="att" src="/uploads/${encodeURIComponent(a.id)}" alt="${esc(a.name)}">`).join("");
    const btns = canChat && st.buttons ? `<div class="btns">${st.buttons.flat().map(([lbl, data]) => `<button class="btn sm" onclick="pressBtn('${esc(data)}')">${esc(lbl)}</button>`).join("")}</div>` : "";
    return `<div class="msg ${cls}"><span class="meta">${t("who." + m.channel)} · ${fmtT(m.ts)}${esc(extra)}</span>${esc(text)}${att}${btns}</div>`;
  }).join("") || `<div class="hint">${t("chat.empty")}</div>`;
  return `<h3 class="sub">${t("sessions")}<span class="sessions">${sess}</span>
      ${p.state === "active" ? `<button class="btn sm" onclick="newSession()">${t("new.session")}</button>` : ""}
      ${selSession && selSession !== p.current_session && p.state === "active" ? `<button class="btn sm" onclick="act('/api/sessions/${esc(selSession)}/use', {})">${t("set.current")}</button>` : ""}
      ${selSession ? `<button class="btn sm" onclick="renameSession()">${t("rename")}</button><button class="btn sm" onclick="showContext()">${t("ctx.view")}</button>` : ""}</h3>
    <div class="chat">${bubbles}</div>
    ${canChat ? `<form class="chatbox" id="chatform"><label class="btn" style="margin:0">${t("attach")}<input type="file" id="chat-file" accept="image/*,video/mp4" hidden multiple></label>
      <input type="text" id="chat-in" placeholder="${esc(t("chat.ph"))}" autocomplete="off"><button class="btn primary">${t("send")}</button></form>
      <div class="chips" id="chips"></div>` : `<div class="hint" style="margin-top:8px">${t("chat.readonly")}</div>`}`;
}
function bindChat(){
  const f = $("#chatform"); if (!f) return;
  renderChips();
  f.onsubmit = async e => {
    e.preventDefault(); const inp = $("#chat-in"), text = inp.value.trim(); if (!text && !pending.length) return;
    inp.value = ""; const atts = pending.map(x => x.id); pending = [];
    await act("/api/chat", {text: text || "(image)", attachments: atts}); loadProject(true);
  };
  $("#chat-file").onchange = async e => {
    for (const file of e.target.files){
      toast(t("uploading"));
      try {
        const r = await fetch(`/api/upload?name=${encodeURIComponent(file.name)}`, {method:"POST", body:file});
        const j = await r.json(); if (!r.ok) throw new Error(j.detail || r.status);
        pending.push(j); renderChips();
      } catch(err){ toast(t("not.done") + err.message, true); }
    }
    e.target.value = "";
  };
}
function renderChips(){
  const c = $("#chips"); if (!c) return;
  c.innerHTML = pending.map((x, i) => `<span class="chip"><img src="/uploads/${encodeURIComponent(x.id)}" alt="">${esc(x.name)} <button class="btn sm" onclick="pending.splice(${i},1);renderChips()">×</button></span>`).join("");
}

      ${Object.entries(v.assets).map(([role, a]) => {
        const name = a.file.split("/").pop(), u = `/packfile/${encodeURIComponent(p.id)}/v${v.version}/${encodeURIComponent(name)}`;
        return `<figure>${a.kind === "video" ? `<video src="${u}" muted preload="metadata"></video>` : `<img src="${u}" alt="${esc(role)}">`}${esc(role)}</figure>`;
      }).join("")}<span class="hint">${esc(v.note || "")} · ${fmtT(v.created)}</span></div>`).join("") || `<div class="hint">${t("pack.empty")}</div>`}</div>`;
}

/* ================= gallery ================= */
function renderGallery(){
  const items = TASKS.flatMap(tk => (tk.outputs || []).map(o => ({tk, o}))).filter(x => galleryKind === "all" || x.o.kind === galleryKind);
  $("#gallery").innerHTML = items.length ? items.map(({tk, o}) => `<div class="item">${media(tk, o)}
      <div class="cap"><span title="${esc(tk.title || tk.template)}">${esc(tk.title || tk.template)}</span>${badge(tk.state)}</div></div>`).join("")
    : `<div class="empty">${t("no.outputs")}</div>`;
}

/* ================= refresh ================= */
let keys = {};
async function refreshAll(force){
  await pollSystem();
  try { PROJECTS = await api("/api/projects"); } catch {}
  const sel = $("#flow-project"), cur = sel.value;
  sel.innerHTML = `<option value="">${t("flow.all")}</option>` + PROJECTS.map(p => `<option value="${esc(p.id)}">${esc(p.name)} (${esc(stateName(p.state))})</option>`).join("");
  sel.value = cur;
  if (view === "flow"){
    try { GRAPH = await api("/api/graph" + (sel.value ? `?project=${encodeURIComponent(sel.value)}` : "")); } catch { return; }
    const k = LANG + GRAPH.map(n => n.id + n.updated + n.tasks.map(x => x.updated).join()).join("|");
    if (force || k !== keys.g){ keys.g = k; renderDag(); }
    if (!selNode && GRAPH.length){ selNode = [...GRAPH].sort((a,b) => b.updated - a.updated)[0].id; renderDag(); }
    renderDetail();
  } else if (view === "review"){
    try { REVIEW = await api("/api/review"); } catch { return; }
    const k = LANG + REVIEW.map(r => r.id + r.tasks.map(x => x.updated).join()).join("|");
    if (force || k !== keys.r){ keys.r = k; renderReview(); }
  } else if (view === "projects"){
    const k = LANG + PROJECTS.map(p => p.id + p.updated).join("|") + (SYS && SYS.project.id);
    if (force || k !== keys.p){ keys.p = k; renderProjects(); }
    if (!selProject && SYS){ selProject = SYS.project.id; renderProjects(); }
    loadProject(!!force);
  } else if (view === "gallery"){
    try { TASKS = await api("/api/tasks"); } catch { return; }
    const k = LANG + TASKS.map(x => x.id + x.updated).join("|") + galleryKind;
    if (force || k !== keys.gal){ keys.gal = k; renderGallery(); }
  }
}
(async () => {
  try { META = await api("/api/meta"); } catch {}
  if (!LANG){ try { LANG = (await api("/api/settings")).language || "en"; } catch { LANG = "en"; } }
  if (!I18N[LANG]) LANG = "en";
  applyStatic();
  show(location.hash.slice(1) || "flow");
  setInterval(() => { if (!$("#modal").classList.contains("on") && !(document.activeElement && ["INPUT","TEXTAREA"].includes(document.activeElement.tagName))) refreshAll(); }, 3000);
})();
</script>
