# aco_lw runtime policies (defaults). Override any key in data/policies.yaml.
# Rule: the runtime never changes what a task means on its own. Retries, tier changes and
# automatic next steps happen only where this file says so; anything not covered goes back
# to the LLM (or to you).

# What to do when an asynchronous tool result arrives (a render finished, failed, ...).
continuation:
  round_succeeded: resume_llm          # hand the candidates back to the LLM
  round_failed:
    oom:                               # out-of-memory errors from the executor
      action: retry                    # retry | resume_llm
      max_retries: 1                   # same template, tier, prompt and seeds — nothing else changes
    lost:                              # executor lost the job
      action: resume_llm
    other:
      action: resume_llm
  pipeline_step_succeeded: auto_next   # auto_next: queue the next step without waking the LLM
  pipeline_step_failed: resume_llm     # let the LLM re-plan
  pipeline_finished: resume_llm

# What tools may do. allow: true | false. approval: never | unless_named | always
#   unless_named = needs your button unless your own message named it (e.g. "use #2", "hd 60s")
execution:
  network: true                        # web_fetch; commands reach the internet only after approval
  tools:
    get_status: {allow: true}
    list_templates: {allow: true}
    get_project: {allow: true}
    get_round: {allow: true}
    queue_round: {allow: true, max_n: 8, unmeasured_video: unless_named}
    queue_pipeline: {allow: true, max_steps: 8}
    wait_for_round: {allow: true}
    redo_round: {allow: true}
    refine_candidate: {allow: true}
    reject_round: {allow: true}
    propose_selection: {allow: true, approval: unless_named}
    propose_memory: {allow: true}
    ask_user: {allow: true}
    list_workflows: {allow: true}
    create_production: {allow: true}
    get_production_plan: {allow: true}
    run_stage: {allow: true}           # stages marked confirm (videos) also need user_confirmed
    review_stage: {allow: true}
    update_production_settings: {allow: true}
    comfy_catalog: {allow: true}
    comfy_describe: {allow: true}
    comfy: {allow: true}               # comfy_bridge.py 再按工具 + 动作分类：读放行、安装需批准、危险的拒绝
    run_comfy_workflow: {allow: true}  # 经编排器排队（可追踪、受暂停与资源闸门）
    # 通用工具（toolbox.py）：编排器执行，agent 只提出请求
    web_fetch: {allow: true}
    run_command:                       # 每条命令都要你批准；auto_allow 里的前缀（单条命令、无管道）免批准
      allow: true
      auto_allow: []                   # 例：["ffprobe", "agent-reach doctor"]
    read_file: {allow: true}
    write_file: {allow: true}
    list_skills: {allow: true}
    load_skill: {allow: true}
    memory_read: {allow: true}
    memory_write: {allow: true}
    add_media: {allow: true}
    send_file: {allow: true}
    mcp_list: {allow: true}
    mcp_call: {allow: true}

# MCP tools (servers configured in config.toml [mcp_servers.*]).
# approval: unless_read_only (tools annotated readOnlyHint run directly) | always | never | deny
mcp:
  approval: unless_read_only
  servers: {}                          # per-server override, e.g. {exa: never}
