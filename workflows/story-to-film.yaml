# story / idea + images / web pages / YouTube → finished film; shot videos are shot as a FreeVideo multi-shot film:
# characters stay consistent through FreeVideo character cards, shots continue from the take picked in the previous shot. You pick takes in our review.
name: story-to-film
title: Story → film (FreeVideo cast cards)
description: Characters stay consistent through FreeVideo cast cards; shots are filmed as one FreeVideo film with takes you choose and real continuations.
settings:
  max_clip_seconds: 10      # one generation renders at most this long; longer moments become consecutive shots
  style: ""                 # camera style, e.g. a director (王家卫, Hou Hsiao-hsien) or a description; empty: the direction stage proposes 2–3 options
  image_tier: standard
  image_candidates: 4
  video_candidates: 2       # how many takes per shot for you to choose from
  film_quality: medium      # continuation shots only support light / medium (two-pass acceleration)
  aspect: "16:9"
  subtitles: true
  auto_advance: true
  youtube_frames: 4
  language: English
  width: 1280
  height: 720
  fps: 24
# How this workflow is run (workflow mode); data/workflow_rules.yaml (by workflow name) and a
# production's settings.rules override it, per stage under `stages: {stage_id: {...}}` too.
rules:
  cascade: true             # stopping / rejecting an item stops everything after it until it is approved again
  on_reject: rerender       # a rejected render without a note: rerender (new seeds) | wait (for you)
  guidance: ""              # how to work on it, shown to the agent with the plan
stages:
  - id: source
    title: Sources
    kind: input

  - id: brief
    title: Brief (text · references)
    kind: tool
    tool: ingest
    needs: [source]
    gate: auto

  - id: adaptation
    title: Adaptation
    kind: skill
    skill: adapt-novel
    needs: [brief]
    schema: adaptation

  - id: bible
    title: Story bible (characters · style · voices)
    kind: skill
    skill: story-bible
    needs: [brief, adaptation]
    schema: bible

  - id: characters
    title: Character sheets (casting)
    kind: render
    needs: [bible]
    fan_out: {items: bible.characters, key: id}
    render:
      template: flux2-t2i
      tier: "{settings.image_tier}"
      n: "{settings.image_candidates}"
      params:
        prompt: "Character reference sheet, full body, neutral pose, plain background. {item.look}. Style: {bible.style.look}"
    alternatives:
      - when: {path: ref.use, equals: as_is}
        provide: "{ref.path}"
      - when: {path: ref.use, equals: stylize}
        render:
          template: flux2-edit
          tier: "{settings.image_tier}"
          n: "{settings.image_candidates}"
          params:
            image: "{ref.path}"
            prompt: "Character reference sheet of this person, full body, neutral pose, plain background, same face and build. {item.look}. Style: {bible.style.look}"

  - id: cards
    title: FreeVideo cast cards
    kind: tool
    tool: freevideo_cards     # reuse same-named cards from the library, otherwise create from the approved casting image
    needs: [bible, characters]
    gate: auto

  - id: direction
    title: Direction (style · camera design)
    kind: skill
    skill: film-direction
    needs: [adaptation, bible]
    schema: direction

  - id: storyboard
    title: Storyboard (shots · cast · lines · continuity)
    kind: skill
    skill: storyboard-film
    extra_skills: [h3-prompt-writing]
    needs: [adaptation, bible, cards, direction]
    schema: storyboard-film
    cap: {list: shots, field: seconds, setting: max_clip_seconds}

  - id: clips
    title: Film (FreeVideo takes)
    kind: film
    cast: cards
    needs: [storyboard, cards]
    confirm: true             # shooting takes minutes to hours: wait for you to press start
    fan_out: {items: storyboard.shots, key: id}

  - id: edit
    title: Edit (order · trims · subtitles)
    kind: skill
    skill: edit-timeline
    needs: [storyboard, clips]
    schema: timeline

  - id: final
    title: Final cut
    kind: assemble
    needs: [edit, clips]
    timeline: edit
    clips: clips
