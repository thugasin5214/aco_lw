# novel / idea + images / web pages / YouTube → finished film. The stage DAG is data: another YAML set (ads, music videos, ...) needs no code change.
# expressions: {settings.x}, {item.y}, {bible.style}; @art:stage/key references an approved artifact (and records it as a dependency).
name: novel-to-film
title: Novel → film
description: Turn a story, an idea with reference images, web pages or YouTube videos into a storyboarded short film.
settings:
  image_tier: standard      # flux2 tier (measured)
  video_tier: smoke         # h3 tier: smoke is measured; name other tiers explicitly when creating
  image_candidates: 4
  video_candidates: 1
  subtitles: true
  youtube_frames: 4         # frames grabbed per YouTube link as style reference (0 = thumbnail only)
  language: ""              # language of dialogue and scene descriptions, e.g. "Mandarin Chinese (普通话)"; empty = same as the source text
  auto_advance: true        # start the next stage automatically once the previous one is approved (except confirm stages)
  width: 1280
  height: 720
  fps: 24
# How this workflow is run (workflow mode); data/workflow_rules.yaml (by workflow name) and a
# production's settings.rules override it, per stage under `stages: {stage_id: {...}}` too.
rules:
  cascade: true             # stopping / rejecting an item stops everything after it until it is approved again
  on_reject: rerender       # a rejected render without a note: rerender (new seeds) | wait (for you)
  guidance: ""              # how to work on it, shown to the agent with the plan
stages:
  - id: source
    title: Sources
    kind: input               # {"text": "...", "sources": [{kind: image|url|youtube|text, ...}]}; the old format is a piece of text

  - id: brief
    title: Brief (text · references)
    kind: tool
    tool: ingest              # web page text, YouTube subtitles and frames, your images → one material pack
    needs: [source]
    gate: auto

  - id: adaptation
    title: Adaptation
    kind: skill
    skill: adapt-novel
    needs: [brief]
    schema: adaptation

  - id: bible
    title: Story bible (characters · locations · style)
    kind: skill
    skill: story-bible
    needs: [brief, adaptation]
    schema: bible

  - id: characters
    title: Character sheets (casting)
    kind: render
    needs: [bible]
    fan_out: {items: bible.characters, key: id}
    render:
      template: flux2-t2i
      tier: "{settings.image_tier}"
      n: "{settings.image_candidates}"
      params:
        prompt: "Character reference sheet, full body, neutral pose, plain background. {item.look}. Style: {bible.style.look}"
    alternatives:             # you provided a photo of this character: use it as-is, or redraw it in the film's style using it as reference
      - when: {path: ref.use, equals: as_is}
        provide: "{ref.path}"
      - when: {path: ref.use, equals: stylize}
        render:
          template: flux2-edit
          tier: "{settings.image_tier}"
          n: "{settings.image_candidates}"
          params:
            image: "{ref.path}"
            prompt: "Character reference sheet of this person, full body, neutral pose, plain background, same face and build. {item.look}. Style: {bible.style.look}"

  - id: locations
    title: Location plates
    kind: render
    needs: [bible]
    fan_out: {items: bible.locations, key: id}
    render:
      template: flux2-t2i
      tier: "{settings.image_tier}"
      n: "{settings.image_candidates}"
      params:
        prompt: "Establishing shot, no people. {item.look}. Style: {bible.style.look}"
    alternatives:
      - when: {path: ref.use, equals: as_is}
        provide: "{ref.path}"
      - when: {path: ref.use, equals: stylize}
        render:
          template: flux2-edit
          tier: "{settings.image_tier}"
          n: "{settings.image_candidates}"
          params:
            image: "{ref.path}"
            prompt: "Establishing shot of this place, no people, same layout and landmarks. {item.look}. Style: {bible.style.look}"

  - id: storyboard
    title: Storyboard (shots · framing · camera)
    kind: skill
    skill: storyboard
    needs: [adaptation, bible, characters, locations]
    schema: storyboard

  - id: keyframes
    title: Keyframes
    kind: render
    needs: [storyboard, characters, locations]
    fan_out: {items: storyboard.shots, key: id}
    render:
      template: flux2-edit
      tier: "{settings.image_tier}"
      n: "{settings.image_candidates}"
      params:
        image: "@art:{item.ref}"
        prompt: "{item.frame}. {item.framing}. Style: {bible.style.look}"

  - id: clips
    title: Shot videos
    kind: render
    needs: [storyboard, keyframes]
    confirm: true             # video takes minutes to hours: after keyframes are approved, you press start
    fan_out: {items: storyboard.shots, key: id}
    render:
      template: h3-i2v
      tier: "{settings.video_tier}"
      n: "{settings.video_candidates}"
      params:
        image: "@art:keyframes/{item.id}"
        prompt: "{item.motion}. Camera: {item.camera}. {item.frame}{settings.speech_hint}"

  - id: edit
    title: Edit (order · trims · transitions · subtitles)
    kind: skill
    skill: edit-timeline
    needs: [storyboard, clips]
    schema: timeline

  - id: final
    title: Final cut
    kind: assemble
    needs: [edit, clips]
    timeline: edit
    clips: clips
